name: Build desktop app

# Builds the Electron desktop app (frontend + bundled portable Python backend
# with the full F6 model stack) on Linux and Windows. Native ML wheels (torch,
# tensorflow, mediapipe, opencv) can't be cross-compiled, so each OS is built on
# its own runner.
#
# Triggered manually, or by pushing a version tag (v1.2.3). Tag builds publish
# the installers as GitHub Release assets (release storage does not count
# toward the Actions artifact quota); manual runs upload a short-lived build
# artifact instead.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# One run per ref; cancel older in-progress runs.
concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend + portable Python backend
        env:
          # Pinned standalone-Python version: the URL is built directly from
          # these (no GitHub API call), so it's reproducible across all runners.
          PBS_RELEASE: "20260610"
          PBS_PYTHON: "3.12.13"
        run: |
          npm run build
          npm run build:runtime
          npm run build:mongo

      - name: Package installer
        env:
          # No signing certs in CI -> don't let electron-builder try to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish never

      - name: Publish installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both matrix jobs race to create the release; only one wins, the
          # other falls through to the upload.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes "Automated desktop build" || true
          shopt -s nullglob
          files=(release/*.AppImage release/*.exe release/*.zip)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload installer (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: warden-ship-${{ matrix.os }}
          # upload-artifact ignores defaults.working-directory: use repo-root paths.
          path: |
            frontend/release/*.AppImage
            frontend/release/*.exe
            frontend/release/*.zip
          if-no-files-found: warn
          # Installers are ~1-1.5 GB each; the free-plan Actions storage quota
          # is 500 MB, so keep artifacts only long enough to download them.
          retention-days: 1
